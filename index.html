<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zeno Life Medicare</title><link rel="stylesheet" href="style.css"></head><body><main class="shell"><div class="auth"><section class="glass brand"><div class="logo">Z</div><h1>Zeno Life Medicare</h1><p class="muted">Premium Medicine Distribution Portal</p><p>Secure customer ordering • Billing • Stock • Profit management</p></section><section class="glass login"><div class="tabs"><button class="tab active" data-tab="customer">Customer</button><button class="tab" data-tab="admin">Admin</button></div><form id="customerForm" class="form"><h2>Customer Login</h2><label>Customer ID<input id="cid" autocomplete="username" required></label><label>Password<input id="cpw" type="password" autocomplete="current-password" required></label><button class="primary">Login</button><div id="cm" class="msg"></div></form><form id="adminForm" class="form hidden"><h2>Admin Login</h2><p class="muted">Enter your Firebase Admin email or the Admin ID configured for this portal.</p><label>Admin ID / Email<input id="aid" autocomplete="username" required></label><label>Password<input id="apw" type="password" autocomplete="current-password" required></label><button class="primary">Admin Login</button><div id="am" class="msg"></div></form></section></div></main><script type="module" src="login.js"></script></body></html>
