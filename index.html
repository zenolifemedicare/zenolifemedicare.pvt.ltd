<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zeno Life Medicare</title>
<link rel="stylesheet" href="style.css?v=5">
</head>
<body class="login-page">
<div class="blossoms" aria-hidden="true">
  <span>✿</span><span>❀</span><span>✿</span><span>❀</span><span>✿</span><span>❀</span><span>✿</span><span>❀</span><span>✿</span><span>❀</span>
</div>
<main class="auth-shell">
  <section class="brand-card">
    <div class="logo">Z</div>
    <div class="brand-kicker">ZENOLIFE</div>
    <h1>Zeno Life Medicare</h1>
    <p class="tagline">Premium Medicine Distribution Portal</p>
    <div class="brand-line"></div>
    <p class="brand-sub">Secure customer ordering • Billing • Stock • Profit management</p>
  </section>

  <section class="login-card">
    <div class="tabs">
      <button type="button" class="tab active" data-tab="customer">Customer</button>
      <button type="button" class="tab" data-tab="admin">Admin</button>
    </div>

    <form id="customerForm" class="form">
      <div class="form-heading"><span class="heading-dot"></span><div><h2>Customer Login</h2><p class="muted">Use your Customer ID and password.</p></div></div>
      <label>Customer ID<input id="cid" required autocomplete="username" placeholder="Enter Customer ID"></label>
      <label>Password<input id="cpw" type="password" required autocomplete="current-password" placeholder="Enter password"></label>
      <button class="primary" type="submit">Login <span>→</span></button>
      <div id="cm" class="msg" role="alert"></div>
    </form>

    <form id="adminForm" class="form hidden">
      <div class="form-heading"><span class="heading-dot"></span><div><h2>Admin Login</h2><p class="muted">Enter your Firebase Admin email or Admin ID.</p></div></div>
      <label>Admin ID / Email<input id="aid" autocomplete="username" required placeholder="Admin ID / Email"></label>
      <label>Password<input id="apw" type="password" autocomplete="current-password" required placeholder="Enter password"></label>
      <button class="primary" type="submit">Admin Login <span>→</span></button>
      <div id="am" class="msg" role="alert"></div>
    </form>
    <div class="secure-note">🔒 Secure Firebase authentication</div>
  </section>
</main>
<script type="module" src="login.js?v=5?v=4"></script>
</body>
</html>
